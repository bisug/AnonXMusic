name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Lint with ruff
      run: |
        uv pip install ruff
        # Stop the build only if there are Python syntax errors or undefined names.
        # This prevents failure on purely stylistic issues.
        uv run ruff check . --select=E9,F63,F7,F82 --output-format=github

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-check
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Test Docker Build
      # Only build the image, don't push. This ensures the Dockerfile is always working.
      run: docker build -t anonxmusic:test .
