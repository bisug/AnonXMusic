name: CI

on:
  push:
    branches: ["master", "main", "dev"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install ffmpeg
        # melody/__init__ imports ensure_dirs(), which requires ffmpeg on PATH.
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        # Syntax errors / undefined names fail the build; style stays advisory.
        run: uvx ruff check . --select=E9,F63,F7,F82 --output-format=github

      - name: Run tests
        # Offline unit tests (no network, no Telegram/Mongo needed).
        run: uv run python -m unittest discover -s tests -v

      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress --exclude '^mailto:' 'README.md' 'wiki/*.md'

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Test Docker build
        # Only build the image, don't push. Keeps the Dockerfile working.
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: melody:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

