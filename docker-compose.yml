# Docker Compose for running AnonXMusic on a VPS.
# Usage:
#   1. cp sample.env .env   &&  edit .env with your values
#   2. docker compose up -d --build
#   3. docker compose logs -f       # view logs
#   4. docker compose down          # stop
services:
  # PO token provider — makes yt-dlp requests look like a real browser and
  # avoids YouTube "confirm you're not a bot" walls on datacenter IPs.
  # Optional: set POT_BASE_URL=http://pot-provider:4416 in .env to enable.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: pot-provider
    restart: unless-stopped

  anonxmusic:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonxmusic:latest
    container_name: anonxmusic
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - pot-provider
    # Persist downloaded cookies across restarts (optional).
    volumes:
      - ./anony/cookies:/app/anony/cookies
    # This bot has no inbound HTTP server; it connects out to Telegram only.
    # No ports are published on purpose.
